version: 2

models:
  - name: base__pelm_ledger_coverage
    description: >
      The Barratt & Cooke ledger statements that were parsed, one row per statement (each PDF
      holds one statement per sub-ledger). Used to work out which months have a complete set of
      cash flows. Empty if data/pelm/pelm_ledger_coverage.csv is absent.

      **Grain**: One row per (ledger, period_start, source_file)
      **Source**: data/pelm/pelm_ledger_coverage.csv (generated by parse_pelm_ledger.py)
    columns:
      - name: ledger
        description: "capital (C070982), dividends (E070982), income (t070982) or fees (d070982)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [capital, dividends, income, fees]
      - name: period_start
        description: "First day the statement covers."
        tests:
          - not_null
      - name: period_end
        description: "Last day the statement covers."
        tests:
          - not_null
      - name: opening_gbp
        description: "Statement opening balance."
      - name: closing_gbp
        description: "Statement closing balance."
      - name: source_file
        description: "PDF the statement was read from."
