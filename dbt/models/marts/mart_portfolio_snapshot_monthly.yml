version: 2

models:
  - name: mart_portfolio_snapshot_monthly
    description: >
      One row per (account, calendar month) from account opening through the
      last completed month. Spine is driven by dim_account.account_open_date
      joined to dim_date.

      month_end_value_gbp reflects total portfolio value including cash holdings
      (funds + cash), sourced from fct_holdings_daily on dates where
      dim_date.month_end_indicator = 'Month End'.

      Inflows (contributions + transfers) and fund purchases are sourced from fct_transactions,
      classified via dim_transaction_type.

      **Grain**: One row per (account_name, year_month)
      **Update Frequency**: Daily
      **Sources**: fct_holdings_daily, fct_transactions, base__pelm_valuations, fct_pelm_transactions, int_pelm_ledger_coverage_monthly, dim_account, dim_date, dim_transaction_type
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [account_name, year_month]
    columns:
      - name: account_name
        description: "ISA, SIPP or PELM."
        tests:
          - not_null
      - name: year_month
        description: "YYYY-MM string for the calendar month (e.g. 2024-03)."
        tests:
          - not_null
      - name: financial_year
        description: "UK tax-year label (e.g. FY25 = April 2024 – March 2025)."
        tests:
          - not_null
      - name: month_end_date
        description: >
          Last calendar day of the month, sourced from dim_date where
          month_end_indicator = 'Month End'. Null for months before the first
          holding.
      - name: month_end_value_gbp
        description: >
          Total market value of all holdings (funds + cash) on the month-end date. Null for months
          before the first holding. PELM rows come straight from the Barratt & Cooke valuations
          (base__pelm_valuations); a null there means a month is missing from the seed.
        tests:
          - not_null:
              config:
                where: "account_name = 'PELM'"
      - name: monthly_inflows_gbp
        description: "Total inflows (contributions + transfers) received within the calendar month. Zero for months with no inflows. For PELM, external flows from the ledger (fct_pelm_transactions category external_flow: transfers in, capital withdrawals, BACS income payments to the beneficiary; positive in, negative out)."
      - name: monthly_net_fund_purchases_gbp
        description: >
          Gross fund buys minus gross fund sells within the calendar month.
          Positive = net buyer, negative = net seller. Zero for months with no
          trades. Null for PELM (no fund trades exist). Differs from monthly_inflows_gbp because cash can
          sit uninvested between inflow and deployment.
      - name: cash_balance_gbp
        description: >
          PELM only: cash held at month-end, rebuilt from the ledger (opening balance + cash
          movements across the sub-ledgers, with the deposit account counted as cash). Null for
          ISA/SIPP and for months before the ledger starts. Dividends, interest and fees are only
          included where those ledgers were supplied, so this is an estimate.
      - name: invested_value_gbp
        description: "PELM only: month_end_value_gbp minus cash_balance_gbp. Null where either is null."
      - name: cash_flow_coverage_indicator
        description: >
          'Complete' when every external cash flow in the month is known: always for ISA/SIPP;
          for PELM only when the capital and dividends ledgers cover the month
          (int_pelm_ledger_coverage_monthly). PELM's 'Incomplete' months are missing the BACS
          income payments to the beneficiary, so their monthly_return is understated.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Complete, Incomplete]
